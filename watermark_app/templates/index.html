<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pro Media Watermarker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
  <script src="{{ url_for('static', filename='js/app.js') }}" defer></script>
</head>
<body>
  <main class="page">
    <form action="/watermark" method="post" enctype="multipart/form-data" class="watermark-form">
      <h1>Media Watermark Studio</h1>
      <p class="intro">Upload any image or video and choose where your text or logo appears.</p>

      {% if error_message %}
      <div class="alert alert-error" role="alert" data-alert-message>{{ error_message }}</div>
      {% endif %}

      <div class="field">
        <label for="media">1. Image or Video File *</label>
        <input id="media" type="file" name="media" accept="image/*,video/*" required>
      </div>

      <div class="field">
        <label for="text">2A. Custom Watermark Text</label>
        <input id="text" type="text" name="text" value="© Brand Name">
      </div>

      <div class="field">
        <label for="logo">2B. Or Upload Logo PNG (Overrides Text)</label>
        <input id="logo" type="file" name="logo" accept="image/*">
      </div>

      <div class="field">
        <label for="position">Watermark Position</label>
        <select id="position" name="position">
          <option value="top-left">Left top</option>
          <option value="top-right" selected>Right top</option>
          <option value="center">Center</option>
          <option value="bottom-left">Bottom left</option>
          <option value="bottom-right">Bottom right</option>
        </select>
      </div>

      <div class="field">
        <label for="opacity">Opacity (<span id="opacity-value">180</span>)</label>
        <input id="opacity" type="range" name="opacity" min="40" max="255" value="180">
      </div>

      <button type="submit">Apply Watermark &amp; Download</button>
    </form>
  </main>
</body>
</html>
